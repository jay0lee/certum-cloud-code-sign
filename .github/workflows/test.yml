name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-windows-runners:
    name: Discover Windows Runners
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.discover.outputs.runners }}
      have-secrets: ${{ steps.check-secrets.outputs.have-secrets }}
    steps:
      - name: Check Secrets Availability
        id: check-secrets
        shell: bash
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
        run: |
          if [ -n "$CERTUM_USERNAME" ] && [ -n "$CERTUM_TOTP_SECRET" ]; then
            echo "have-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "have-secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Query GitHub API for Supported Windows Runners
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Calling GitHub API for actions/runner-images..."
          AUTH_HEADER=""
          if [ -n "$GH_TOKEN" ]; then
            AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          fi

          CONTENT=$(curl -sSL -H "User-Agent: GitHub-Actions-Runner-Discovery" ${AUTH_HEADER:+-H "$AUTH_HEADER"} "https://api.github.com/repos/actions/runner-images/readme" | jq -r .content | base64 -d 2>/dev/null || true)

          if [ -n "$CONTENT" ]; then
            # Extract canonical runner labels from the Windows table rows:
            # - Matches lines starting with '| Windows' and excludes deprecated images
            # - Extracts labels enclosed in backticks
            # - Excludes aliases like '-latest' and specific visual studio variants like '-vs[0-9]+'
            RUNNERS=$(echo "$CONTENT" | \
              awk -F'|' '/^\| Windows/ && !/deprecated/ {print $4}' | \
              grep -o '`windows-[^`]*`' | tr -d '`' | \
              grep -v '\-latest' | grep -v '\-vs[0-9]*' | sort -u | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          # Fallback if API was unreachable or rate-limited
          if [ -z "$RUNNERS" ] || [ "$RUNNERS" = "[]" ] || [ "$RUNNERS" = "null" ]; then
            echo "API discovery returned empty or failed, using canonical fallback list"
            RUNNERS='["windows-11-arm","windows-2022","windows-2025"]'
          fi

          echo "Discovered Windows runner matrix: $RUNNERS"
          echo "runners=$RUNNERS" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    needs: discover-windows-runners
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.discover-windows-runners.outputs.runners) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run Unit Tests
        run: npm test

  test-install:
    name: Test SimplySign Desktop Installer (${{ matrix.os }})
    needs: discover-windows-runners
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.discover-windows-runners.outputs.runners) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Run Installer Script
        shell: pwsh
        run: |
          & ./scripts/install.ps1
        env:
          INPUT_VERSION: '9.4.4.92'

      - name: Verify SimplySign Desktop Binary
        shell: pwsh
        run: |
          $path = 'C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe'
          if (-not (Test-Path $path)) {
            Write-Error "SimplySign Desktop executable was not found at $path"
            exit 1
          }
          Write-Host "Binary verified at $path"

  e2e-auth-test:
    name: End-to-End Auth Test (${{ matrix.os }})
    needs: [ discover-windows-runners, unit-tests, test-install ]
    runs-on: ${{ matrix.os }}
    if: needs.discover-windows-runners.outputs.have-secrets == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.discover-windows-runners.outputs.runners) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Test Certum Action
        id: certum
        uses: ./
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          debug: 'true'

      - name: Display Certificate Outputs
        shell: pwsh
        run: |
          Write-Host "Thumbprint : ${{ steps.certum.outputs.cert-thumbprint }}"
          Write-Host "Subject    : ${{ steps.certum.outputs.cert-subject }}"
          Write-Host "Issuer     : ${{ steps.certum.outputs.cert-issuer }}"
          Write-Host "Expiration : ${{ steps.certum.outputs.cert-expiration }}"
          Write-Host "SignTool   : ${{ steps.certum.outputs.signtool-path }}"

      - name: Teardown SimplySign Desktop Session
        if: always()
        uses: ./teardown
