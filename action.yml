name: 'Certum Cloud Code Signing'
description: 'Install, authenticate, and configure Certum SimplySign Desktop for Cloud Code Signing on Windows x86_64 and ARM64 runners.'
author: 'jay0lee'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  username:
    description: 'Certum SimplySign account email / username'
    required: true
  totp_secret:
    description: 'Certum TOTP secret key (Base32 format) for generating one-time passwords'
    required: false
    default: ''
  totp-secret:
    description: 'Alias for totp_secret'
    required: false
    default: ''
  version:
    description: 'SimplySign Desktop version to download and install'
    required: false
    default: '9.4.4.92'
  download-url:
    description: 'Custom direct URL to download SimplySign Desktop MSI. If omitted, constructed from version.'
    required: false
    default: ''
  app-path:
    description: 'Path to SimplySign Desktop executable'
    required: false
    default: 'C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe'
  totp_algorithm:
    description: 'Hashing algorithm for TOTP (Certum uses SHA-256)'
    required: false
    default: 'SHA-256'
  totp-algorithm:
    description: 'Alias for totp_algorithm'
    required: false
    default: ''
  totp_digits:
    description: 'Number of digits in TOTP token'
    required: false
    default: '6'
  totp-digits:
    description: 'Alias for totp_digits'
    required: false
    default: ''
  totp_period:
    description: 'TOTP refresh period in seconds'
    required: false
    default: '30'
  totp-period:
    description: 'Alias for totp_period'
    required: false
    default: ''
  cert_sha1:
    description: 'Expected SHA-1 thumbprint of the certificate. If omitted, auto-discovers code signing certificate.'
    required: false
    default: ''
  cert-sha1:
    description: 'Alias for cert_sha1'
    required: false
    default: ''
  wait_for_cert_timeout:
    description: 'Maximum seconds to wait for certificates to appear in Windows certificate store after login'
    required: false
    default: '60'
  wait-for-cert-timeout:
    description: 'Alias for wait_for_cert_timeout'
    required: false
    default: ''
  debug:
    description: 'Enable saving and archiving desktop screenshots and diagnostic logs for troubleshooting'
    required: false
    default: 'false'
  screenshots_dir:
    description: 'Directory path where debug screenshots and logs are stored. Defaults to $env:RUNNER_TEMP\certum-screenshots (e.g. D:\a\_temp\certum-screenshots on GitHub runners).'
    required: false
    default: ''
  screenshots-dir:
    description: 'Alias for screenshots_dir'
    required: false
    default: ''

outputs:
  cert-thumbprint:
    description: 'SHA-1 thumbprint of the active Certum code signing certificate'
    value: ${{ steps.verify.outputs.cert-thumbprint }}
  cert-subject:
    description: 'Subject name of the certificate'
    value: ${{ steps.verify.outputs.cert-subject }}
  cert-issuer:
    description: 'Issuer of the certificate'
    value: ${{ steps.verify.outputs.cert-issuer }}
  cert-expiration:
    description: 'Expiration date (ISO 8601) of the certificate'
    value: ${{ steps.verify.outputs.cert-expiration }}
  cert-count:
    description: 'Total number of certificates detected in the personal certificate store'
    value: ${{ steps.verify.outputs.cert-count }}
  signtool-path:
    description: 'Discovered path to x64 signtool.exe'
    value: ${{ steps.verify.outputs.signtool-path }}
  screenshots-path:
    description: 'Directory path where screenshots and logs were stored'
    value: ${{ steps.dirs.outputs.screenshots-dir }}

runs:
  using: 'composite'
  steps:
    - name: Validate Environment and Required Inputs
      shell: pwsh
      run: |
        # 1. Validate operating system
        if ($env:RUNNER_OS -ne 'Windows') {
          Write-Error "certum-cloud-code-sign is designed specifically for Windows runners (x64 and ARM64). Current OS: $env:RUNNER_OS"
          exit 1
        }
        Write-Host "Runner OS confirmed: Windows ($env:RUNNER_ARCH)"

        # 2. Fail fast if required parameters are missing
        $missing = @()
        if ([string]::IsNullOrWhiteSpace($env:INPUT_USERNAME)) {
          $missing += "'username'"
        }
        $effectiveTotp = if ($env:INPUT_TOTP_SECRET) { $env:INPUT_TOTP_SECRET } else { $env:INPUT_TOTP_SECRET_DASH }
        if ([string]::IsNullOrWhiteSpace($effectiveTotp)) {
          $missing += "'totp_secret'"
        }

        if ($missing.Count -gt 0) {
          $missingList = $missing -join " and "
          Write-Error "Missing required input(s): $missingList. Please specify $missingList in your workflow's 'with:' block."
          exit 1
        }
        Write-Host "All required inputs ('username', 'totp_secret') are present."
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_TOTP_SECRET: ${{ inputs.totp_secret }}
        INPUT_TOTP_SECRET_DASH: ${{ inputs.totp-secret }}

    - name: Prepare Directories
      id: dirs
      shell: pwsh
      run: |
        $sDir = $env:INPUT_SCREENSHOTS_DIR
        if ([string]::IsNullOrWhiteSpace($sDir)) {
          $baseTemp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $sDir = Join-Path $baseTemp "certum-screenshots"
          Write-Host "No custom screenshots_dir specified. Defaulting to runner temp directory: $sDir"
        } else {
          Write-Host "Using custom screenshots_dir: $sDir"
        }
        New-Item -ItemType Directory -Force -Path $sDir | Out-Null
        Add-Content -Path $env:GITHUB_OUTPUT -Value "screenshots-dir=$sDir"
        Add-Content -Path $env:GITHUB_ENV -Value "CERTUM_SCREENSHOTS_DIR=$sDir"
      env:
        INPUT_SCREENSHOTS_DIR: ${{ inputs.screenshots_dir || inputs.screenshots-dir }}

    - name: Download and Install SimplySign Desktop
      shell: pwsh
      run: |
        & "${{ github.action_path }}/scripts/install.ps1"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_DOWNLOAD_URL: ${{ inputs.download-url }}
        INPUT_APP_PATH: ${{ inputs.app-path }}
        INPUT_DEBUG: ${{ inputs.debug }}

    - name: Authenticate SimplySign Desktop
      shell: pwsh
      run: |
        node "${{ github.action_path }}/scripts/auth.mjs"
      env:
        CERTUM_USERNAME: ${{ inputs.username }}
        CERTUM_TOTP_SECRET: ${{ inputs.totp_secret || inputs.totp-secret }}
        CERTUM_APP_PATH: ${{ inputs.app-path }}
        CERTUM_TOTP_ALGORITHM: ${{ inputs.totp_algorithm || inputs.totp-algorithm || 'SHA-256' }}
        CERTUM_TOTP_DIGITS: ${{ inputs.totp_digits || inputs.totp-digits || '6' }}
        CERTUM_TOTP_PERIOD: ${{ inputs.totp_period || inputs.totp-period || '30' }}
        CERTUM_SCREENSHOTS_DIR: ${{ steps.dirs.outputs.screenshots-dir }}
        CERTUM_DEBUG: ${{ inputs.debug }}

    - name: Verify Certificate and Discover SignTool
      id: verify
      shell: pwsh
      run: |
        & "${{ github.action_path }}/scripts/verify.ps1"
      env:
        INPUT_TIMEOUT: ${{ inputs.wait_for_cert_timeout || inputs.wait-for-cert-timeout || '60' }}
        INPUT_CERT_SHA1: ${{ inputs.cert_sha1 || inputs.cert-sha1 }}
        INPUT_SCREENSHOTS_DIR: ${{ steps.dirs.outputs.screenshots-dir }}
        INPUT_DEBUG: ${{ inputs.debug }}

    - name: Archive Desktop Screenshots and Logs
      if: always() && (inputs.debug == 'true' || failure())
      uses: actions/upload-artifact@v4
      with:
        name: certum-debug-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        path: |
          ${{ steps.dirs.outputs.screenshots-dir }}/*.png
          ${{ steps.dirs.outputs.screenshots-dir }}/*.log
          ${{ runner.temp }}/install.log
        if-no-files-found: ignore
