name: 'Certum Cloud Code Signing'
description: 'Install, authenticate, and configure Certum SimplySign Desktop for Cloud Code Signing on Windows x86_64 and ARM64 runners.'
author: 'jay0lee'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  username:
    description: 'Certum SimplySign account email / username'
    required: true
  totp-secret:
    description: 'Certum TOTP secret key (Base32 format) for generating one-time passwords'
    required: true
  version:
    description: 'SimplySign Desktop version to download and install'
    required: false
    default: '9.4.4.92'
  download-url:
    description: 'Custom direct URL to download SimplySign Desktop MSI. If omitted, constructed from version.'
    required: false
    default: ''
  app-path:
    description: 'Path to SimplySign Desktop executable'
    required: false
    default: 'C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe'
  totp-algorithm:
    description: 'Hashing algorithm for TOTP (Certum uses SHA-256)'
    required: false
    default: 'SHA-256'
  totp-digits:
    description: 'Number of digits in TOTP token'
    required: false
    default: '6'
  totp-period:
    description: 'TOTP refresh period in seconds'
    required: false
    default: '30'
  cert-sha1:
    description: 'Expected SHA-1 thumbprint of the certificate. If omitted, auto-discovers code signing certificate.'
    required: false
    default: ''
  wait-for-cert-timeout:
    description: 'Maximum seconds to wait for certificates to appear in Windows certificate store after login'
    required: false
    default: '60'
  debug:
    description: 'Enable saving and archiving desktop screenshots and diagnostic logs for troubleshooting'
    required: false
    default: 'false'
  screenshots-dir:
    description: 'Directory path where debug screenshots and logs are stored'
    required: false
    default: ''

outputs:
  cert-thumbprint:
    description: 'SHA-1 thumbprint of the active Certum code signing certificate'
    value: ${{ steps.verify.outputs.cert-thumbprint }}
  cert-subject:
    description: 'Subject name of the certificate'
    value: ${{ steps.verify.outputs.cert-subject }}
  cert-issuer:
    description: 'Issuer of the certificate'
    value: ${{ steps.verify.outputs.cert-issuer }}
  cert-expiration:
    description: 'Expiration date (ISO 8601) of the certificate'
    value: ${{ steps.verify.outputs.cert-expiration }}
  cert-count:
    description: 'Total number of certificates detected in the personal certificate store'
    value: ${{ steps.verify.outputs.cert-count }}
  signtool-path:
    description: 'Discovered path to x64 signtool.exe'
    value: ${{ steps.verify.outputs.signtool-path }}
  screenshots-path:
    description: 'Directory path where screenshots and logs were stored'
    value: ${{ steps.dirs.outputs.screenshots-dir }}

runs:
  using: 'composite'
  steps:
    - name: Validate Runner OS
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -ne 'Windows') {
          Write-Error "certum-cloud-code-sign is designed specifically for Windows runners (x64 and ARM64). Current OS: $env:RUNNER_OS"
          exit 1
        }
        Write-Host "Running on Windows ($env:RUNNER_ARCH)"

    - name: Prepare Directories
      id: dirs
      shell: pwsh
      run: |
        $sDir = $env:INPUT_SCREENSHOTS_DIR
        if (-not $sDir) {
          $sDir = Join-Path $env:RUNNER_TEMP "certum-screenshots"
        }
        New-Item -ItemType Directory -Force -Path $sDir | Out-Null
        Add-Content -Path $env:GITHUB_OUTPUT -Value "screenshots-dir=$sDir"
        Add-Content -Path $env:GITHUB_ENV -Value "CERTUM_SCREENSHOTS_DIR=$sDir"
      env:
        INPUT_SCREENSHOTS_DIR: ${{ inputs.screenshots-dir }}

    - name: Download and Install SimplySign Desktop
      shell: pwsh
      run: |
        & "${{ github.action_path }}/scripts/install.ps1"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_DOWNLOAD_URL: ${{ inputs.download-url }}
        INPUT_APP_PATH: ${{ inputs.app-path }}
        INPUT_DEBUG: ${{ inputs.debug }}

    - name: Authenticate SimplySign Desktop
      shell: pwsh
      run: |
        node "${{ github.action_path }}/scripts/auth.mjs"
      env:
        CERTUM_USERNAME: ${{ inputs.username }}
        CERTUM_TOTP_SECRET: ${{ inputs.totp-secret }}
        CERTUM_APP_PATH: ${{ inputs.app-path }}
        CERTUM_TOTP_ALGORITHM: ${{ inputs.totp-algorithm }}
        CERTUM_TOTP_DIGITS: ${{ inputs.totp-digits }}
        CERTUM_TOTP_PERIOD: ${{ inputs.totp-period }}
        CERTUM_SCREENSHOTS_DIR: ${{ steps.dirs.outputs.screenshots-dir }}
        CERTUM_DEBUG: ${{ inputs.debug }}

    - name: Verify Certificate and Discover SignTool
      id: verify
      shell: pwsh
      run: |
        & "${{ github.action_path }}/scripts/verify.ps1"
      env:
        INPUT_TIMEOUT: ${{ inputs.wait-for-cert-timeout }}
        INPUT_CERT_SHA1: ${{ inputs.cert-sha1 }}
        INPUT_SCREENSHOTS_DIR: ${{ steps.dirs.outputs.screenshots-dir }}
        INPUT_DEBUG: ${{ inputs.debug }}

    - name: Archive Desktop Screenshots and Logs
      if: always() && (inputs.debug == 'true' || failure())
      uses: actions/upload-artifact@v4
      with:
        name: certum-debug-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        path: |
          ${{ steps.dirs.outputs.screenshots-dir }}/*.png
          ${{ steps.dirs.outputs.screenshots-dir }}/*.log
          ${{ runner.temp }}/install.log
        if-no-files-found: ignore
